services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: avitus
      POSTGRES_PASSWORD: avitus
      POSTGRES_DB: avitus
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U avitus -d avitus']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - avitus_postgres:/var/lib/postgresql/data
volumes:
  avitus_postgres:
