name: Deploy Fly Production

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

concurrency:
  group: fly-production
  cancel-in-progress: false

permissions:
  # write: moves the deployed-web / deployed-api tags after a verified deploy.
  contents: write

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_API_APP: ${{ vars.FLY_API_APP || 'avitus-materia-api' }}
      FLY_WEB_APP: ${{ vars.FLY_WEB_APP || 'avitus-materia-web' }}
    steps:
      - name: Checkout verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Detect deploy targets
        id: changes
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin 'refs/tags/deployed-*:refs/tags/deployed-*' || true

          # Compare against what is actually running for each app (tag moved after each
          # verified deploy), so a failed or skipped deploy never loses pending changes.
          # Without a tag, fall back to the previous commit.
          changed_since() {
            local tag="$1"
            if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              echo "Base for ${tag}: $(git rev-parse --short "refs/tags/${tag}")" >&2
              git diff --name-only "refs/tags/${tag}" HEAD
            elif git rev-parse -q --verify HEAD^ >/dev/null; then
              echo "Base for ${tag}: HEAD^ (no tag yet)" >&2
              git diff --name-only HEAD^ HEAD
            else
              git ls-tree -r --name-only HEAD
            fi
          }

          changed_since deployed-web > /tmp/changed-web.txt
          changed_since deployed-api > /tmp/changed-api.txt
          echo "Changed since deployed web:"; cat /tmp/changed-web.txt
          echo "Changed since deployed API:"; cat /tmp/changed-api.txt

          deploy_web=false
          deploy_api=false

          if grep -Eq '^(apps/web/|Dockerfile\.web$|fly\.web\.toml$|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$|packages/config/)' /tmp/changed-web.txt; then
            deploy_web=true
          fi

          if grep -Eq '^(apps/api/|Dockerfile\.api$|fly\.api\.toml$|modules/|packages/database/|packages/config/|package\.json$|pnpm-lock\.yaml$|pnpm-workspace\.yaml$)' /tmp/changed-api.txt; then
            deploy_api=true
          fi

          echo "deploy_web=${deploy_web}" >> "$GITHUB_OUTPUT"
          echo "deploy_api=${deploy_api}" >> "$GITHUB_OUTPUT"
          echo "Targets: web=${deploy_web}, api=${deploy_api}"

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Validate deployment token
        shell: bash
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "FLY_API_TOKEN is not configured."
            exit 1
          fi

      - name: Deploy web
        if: steps.changes.outputs.deploy_web == 'true'
        run: flyctl deploy -c fly.web.toml -a "$FLY_WEB_APP" --remote-only

      - name: Verify public web
        if: steps.changes.outputs.deploy_web == 'true'
        shell: bash
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent --show-error "https://${FLY_WEB_APP}.fly.dev" >/dev/null; then
              echo "Web is reachable."
              exit 0
            fi
            sleep 6
          done
          echo "Web health check failed."
          exit 1

      - name: Record deployed web commit
        if: steps.changes.outputs.deploy_web == 'true'
        run: |
          git tag -f deployed-web HEAD
          git push -f origin refs/tags/deployed-web

      - name: Read-only database preflight
        if: steps.changes.outputs.deploy_api == 'true'
        timeout-minutes: 2
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import os, pathlib, shlex, subprocess
          source = pathlib.Path('scripts/diagnose-production-db.cjs').read_text()
          command = 'node -e ' + shlex.quote(source + '\nrun();')
          subprocess.run(['flyctl', 'ssh', 'console', '-a', os.environ['FLY_API_APP'], '-C', command], check=True, timeout=90)
          PYTHON

      - name: Deploy API
        if: steps.changes.outputs.deploy_api == 'true'
        run: flyctl deploy -c fly.api.toml -a "$FLY_API_APP" --remote-only

      - name: Verify API readiness
        if: steps.changes.outputs.deploy_api == 'true'
        shell: bash
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent --show-error "https://${FLY_API_APP}.fly.dev/ready" >/dev/null; then
              echo "API is ready."
              exit 0
            fi
            sleep 6
          done
          echo "API readiness check failed."
          exit 1

      - name: Record deployed API commit
        if: steps.changes.outputs.deploy_api == 'true'
        run: |
          git tag -f deployed-api HEAD
          git push -f origin refs/tags/deployed-api

      - name: No production deploy needed
        if: steps.changes.outputs.deploy_web != 'true' && steps.changes.outputs.deploy_api != 'true'
        run: echo "No deployable application changes detected."

      - name: Verify configurator capability
        timeout-minutes: 5
        run: node scripts/run-catalog-probe.cjs
