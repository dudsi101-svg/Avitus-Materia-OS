name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: avitus
          POSTGRES_PASSWORD: avitus
          POSTGRES_DB: avitus
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U avitus -d avitus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      AUTH_MODE: development
      DATABASE_URL: postgres://avitus:avitus@localhost:5432/avitus
      ADMIN_ORIGIN: http://localhost:3000
      PUBLIC_INQUIRY_ORGANIZATION_ID: 22222222-2222-4222-8222-222222222222
      PUBLIC_INQUIRY_API_KEY: ci-public-inquiry-key-not-a-production-secret
      AVITUS_API_URL: http://localhost:4000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/fly-codespaces-smoke-test.sh
      - run: pnpm db:migrate
      - run: pnpm db:seed:dev
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
